<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DM2find">
  <!-- Vector rebuild of the DM2find mark: a globe shaped as a speech bubble,
       with a magnifying glass. Redrawn rather than upscaled because the source
       file was 64x64 and went soft above about 80px.
       Simplified on purpose: the original's continent outlines turn to noise
       below ~48px, so the landmasses are reduced to readable shapes and the
       lens shine arc is dropped. The white ring around the magnifier is kept -
       it is what separates the two objects at small sizes. -->
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EC6E8"/>
      <stop offset="0.55" stop-color="#2F8FD0"/>
      <stop offset="1" stop-color="#1F55A0"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#A7E88A"/>
      <stop offset="1" stop-color="#4FC7B8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4415C"/>
      <stop offset="1" stop-color="#F9903A"/>
    </linearGradient>
    <clipPath id="globe">
      <path d="M232 72a196 196 0 1 1-50.7 385.3L60 500l11.5-119.6A196 196 0 0 1 232 72z"/>
    </clipPath>
  </defs>

  <!-- globe as speech bubble -->
  <path d="M232 72a196 196 0 1 1-50.7 385.3L60 500l11.5-119.6A196 196 0 0 1 232 72z" fill="url(#ocean)"/>

  <!-- simplified landmasses, clipped to the globe -->
  <g clip-path="url(#globe)" fill="url(#land)">
    <path d="M120 128c34-14 74-12 96 6 14 12 6 30-10 36-18 7-24 20-14 34 12 17 4 34-16 36-24 3-44-10-56-32-14-26-16-58 0-80z"/>
    <path d="M148 300c26-10 52 4 60 28 7 20 0 44-14 66-12 19-14 40-6 60 6 15-2 28-18 26-20-3-34-22-40-48-9-40-8-100 18-132z"/>
    <path d="M300 250c30-12 60-4 74 18 12 19 8 44-8 70-13 21-18 44-14 66 3 17-10 28-26 22-20-8-32-32-34-64-3-46-6-98 8-112z"/>
    <path d="M330 96c22-6 42 2 50 20 7 16 2 34-12 44-16 11-36 6-46-10-11-18-8-48 8-54z"/>
  </g>

  <!-- magnifying glass: white separation ring, opaque lens, then the frame -->
  <circle cx="368" cy="152" r="101" fill="none" stroke="#FFFFFF" stroke-width="62"/>
  <circle cx="368" cy="152" r="84" fill="#FFFFFF"/>
  <path d="M451 235l46 46" stroke="#FFFFFF" stroke-width="66" stroke-linecap="round"/>
  <path d="M451 235l46 46" stroke="url(#glass)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="368" cy="152" r="101" fill="none" stroke="url(#glass)" stroke-width="34"/>
</svg>
