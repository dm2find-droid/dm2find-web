name: build & publish
on:
  push:
    branches: [main]
  workflow_dispatch:

# Build here rather than on the Hetzner box: that box also runs Supabase and the
# chat backend, and its disk is the tight resource. A finished image is ~60-80 MB;
# a local build lineage costs 1.5-2 GB in layers and cache.
jobs:
  build:
    runs-on: ubuntu-latest
    # De secrets-context bestaat niet in een `if`, ook niet op stapniveau. Via
    # env op jobniveau kan de laatste stap er wel op testen.
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build            # Zod schema failures stop the deploy here
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Tell Coolify to redeploy
        if: env.COOLIFY_WEBHOOK != ''
        run: curl -fsS -X POST "$COOLIFY_WEBHOOK"
