name: build & publish
on:
  push:
    branches: [main]
  workflow_dispatch:

# Build here rather than on the Hetzner box: that box also runs Supabase and the
# chat backend, and its disk is the tight resource. A finished image is ~60-80 MB;
# a local build lineage costs 1.5-2 GB in layers and cache.
jobs:
  build:
    runs-on: ubuntu-latest
    # De secrets-context bestaat niet in een `if`, ook niet op stapniveau. Via
    # env op jobniveau kan de laatste stap er wel op testen.
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN:   ${{ secrets.COOLIFY_TOKEN }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build            # Zod schema failures stop the deploy here
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      # Coolify's deploy-webhook is een API-endpoint en wil een Bearer-token.
      # Zonder token antwoordt hij 401; zonder URL werd deze stap vroeger stil
      # overgeslagen, waardoor de Action groen was en er niets live ging. Nu
      # zegt hij dat hardop, zodat je het in het overzicht ziet.
      - name: Tell Coolify to redeploy
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK of COOLIFY_TOKEN ontbreekt - image staat op GHCR, maar Coolify is NIET aangeroepen. Redeploy met de hand."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
