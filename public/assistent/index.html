<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DM2find — Concierge</title>
<style>
  :root{
    --blue:#0A1F44; --blue2:#1B3A6B; --gold:#F2C94C;
    --paper:#F7F8FA; --green:#4CC38A; --mut:#A9B6CE; --red:#E5734F;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 60% at 50% 0%, #12305e 0%, var(--blue) 55%, #06152e 100%);
    color:var(--paper);
    font-family:'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;overflow:hidden;text-align:center;padding:6vw;
    user-select:none;-webkit-user-select:none;
  }
  .brand{position:fixed;top:5vh;font-size:5vh;font-weight:800;letter-spacing:-0.5px;}
  .brand .find{color:var(--gold);}
  .orb{
    width:34vh;height:34vh;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a5aa0, var(--blue2) 60%, #0d2145);
    box-shadow:0 0 0 0 rgba(242,201,76,.35);
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s ease, box-shadow .25s ease;
    cursor:pointer;
  }
  .orb.idle{ animation:invite 2.6s ease-in-out infinite; }
  .orb.listening{ animation:pulse 2.4s ease-in-out infinite; }
  .orb.speaking{ animation:pulse 0.9s ease-in-out infinite; box-shadow:0 0 60px 10px rgba(242,201,76,.4); }
  .orb.error{ background:radial-gradient(circle at 35% 30%, #7a2d2d, #3a1414); }
  .orb:active{ transform:scale(0.97); }
  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(242,201,76,.30);}
    50%{transform:scale(1.05);box-shadow:0 0 50px 14px rgba(242,201,76,.18);}
  }
  @keyframes invite{
    0%,100%{box-shadow:0 0 0 0 rgba(242,201,76,.35);}
    50%{box-shadow:0 0 45px 12px rgba(242,201,76,.28);}
  }
  .icon{font-size:14vh;line-height:1;pointer-events:none;}
  .status{position:fixed;bottom:16vh;font-size:3.4vh;color:var(--paper);font-weight:600;max-width:80vw;pointer-events:none;}
  .hint{position:fixed;bottom:9vh;font-size:2.2vh;color:var(--mut);max-width:80vw;line-height:1.4;pointer-events:none;}
  .foot{position:fixed;bottom:3vh;font-size:1.7vh;color:var(--mut);pointer-events:none;}
  .foot b{color:var(--paper);}
  #reset{position:fixed;top:0;right:0;width:12vw;height:12vh;}

  /* Ophangknop: alleen zichtbaar tijdens (het opzetten van) een gesprek. */
  .hangup{
    margin-top:4vh;
    display:inline-flex;align-items:center;gap:1.4vh;
    padding:1.6vh 4.2vh;border:0;border-radius:999px;
    background:#D93B3B;color:#fff;
    font:700 2.8vh/1 'Helvetica Neue',Arial,sans-serif;
    box-shadow:0 6px 24px rgba(0,0,0,.35);
    cursor:pointer;touch-action:manipulation;
    visibility:hidden;opacity:0;transition:opacity .2s ease;
  }
  .hangup.show{visibility:visible;opacity:1;}
  .hangup:active{transform:scale(0.97);}
  .hangup:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
  .hangup .h-icon{display:inline-block;transform:rotate(135deg);font-size:3.2vh;}
</style>
</head>
<body>
  <div class="brand">DM2<span class="find">find</span></div>

  <div id="orb" class="orb idle"><div class="icon">&#128222;</div></div>

  <button id="hangup" class="hangup" type="button" aria-label="Raccrocher">
    <span class="h-icon" aria-hidden="true">&#128222;</span><span>Raccrocher</span>
  </button>

  <div id="status" class="status">Decrochez le combine et touchez l'ecran pour commencer</div>
  <div class="hint">Posez vos questions sur la plateforme DM2find &mdash; en francais.</div>
  <div class="foot"><b>Concu &amp; heberge en Europe.</b> Votre voix n'est pas conservee.</div>

  <div id="reset" title="reset"></div>

  <script type="module">
    const AGENT_ID = 'agent_3401kxzvkse2ftysyk4g566xre27';
    import { Conversation } from 'https://esm.sh/@elevenlabs/client';

    const orb = document.getElementById('orb');
    const statusEl = document.getElementById('status');
    const hangupBtn = document.getElementById('hangup');
    let convo = null;
    let starting = false;
    let afgebroken = false;     // opgehangen terwijl de verbinding nog werd opgezet
    let rustTot = 0;            // korte pauze na ophangen: de volgende tik belt niet meteen terug

    function setStatus(text){ statusEl.textContent = text; }
    function setOrb(cls){ orb.className = 'orb ' + cls; }
    function toonOphangen(aan){ hangupBtn.classList.toggle('show', !!aan); }

    function toIdle(){
      convo = null; starting = false;
      setOrb('idle');
      toonOphangen(false);
      setStatus("Decrochez le combine et touchez l'ecran pour commencer");
    }

    // Gesprek beeindigen: sessie dicht, microfoon uit, terug naar de begintoestand.
    async function hangup(){
      const c = convo;
      if (!c && !starting) return;
      rustTot = Date.now() + 1200;
      if (!c) { afgebroken = true; }          // nog aan het verbinden: na het verbinden meteen sluiten
      convo = null;
      setOrb('idle');
      toonOphangen(false);
      setStatus('Au revoir !');
      if (c) { try { await c.endSession(); } catch (e) { console.error(e); } }
      setTimeout(() => { if (!convo && !starting) toIdle(); }, 1500);
    }

    async function start(){
      if (convo || starting || Date.now() < rustTot) return;
      starting = true;
      afgebroken = false;
      try{
        setOrb('listening');
        setStatus('Connexion...');
        toonOphangen(true);
        await navigator.mediaDevices.getUserMedia({ audio: true });
        if (afgebroken) { starting = false; return; }
        const c = await Conversation.startSession({
          agentId: AGENT_ID,
          connectionType: 'webrtc',
          onConnect: () => { setOrb('listening'); setStatus('Je vous ecoute...'); toonOphangen(true); },
          onDisconnect: () => { toIdle(); },
          onError: (e) => { console.error(e); setOrb('error'); setStatus('Un instant...'); toonOphangen(false); setTimeout(toIdle, 2000); },
          onModeChange: (m) => {
            if (m && m.mode === 'speaking'){ setOrb('speaking'); setStatus('...'); }
            else { setOrb('listening'); setStatus('Je vous ecoute...'); }
          },
        });
        starting = false;
        if (afgebroken) {                     // tijdens het verbinden opgehangen
          try { await c.endSession(); } catch (e) {}
          return;
        }
        convo = c;
      }catch(err){
        console.error(err);
        starting = false;
        setOrb('error');
        toonOphangen(false);
        setStatus("Micro non autorise - verifiez l'autorisation");
        setTimeout(toIdle, 2500);
      }
    }

    // Ophangknop: eigen afhandeling; mag het gesprek NIET opnieuw starten.
    ['pointerdown','touchstart'].forEach(ev =>
      hangupBtn.addEventListener(ev, (e) => { e.stopPropagation(); }, { passive: true })
    );
    hangupBtn.addEventListener('click', (e) => { e.stopPropagation(); hangup(); });

    // TAP TO START: geen auto-start bij load; sessie start pas bij eerste tik/klik/toets.
    ['pointerdown','touchstart','keydown'].forEach(ev =>
      window.addEventListener(ev, (e) => {
        const doel = e.target && e.target.closest ? e.target.closest('#reset, #hangup') : null;
        if (doel) return;
        if (ev === 'keydown' && e.key === 'Escape') { hangup(); return; }   // Esc = ophangen
        if (ev === 'keydown' && (convo || starting)) return;                // toetsen tijdens gesprek doen niets
        start();
      })
    );

    // Pagina dicht of naar de achtergrond: nooit een open microfoon achterlaten.
    window.addEventListener('pagehide', () => { if (convo) { try { convo.endSession(); } catch (e) {} } });

    // Verborgen herstart: 3x snel tikken rechtsboven herlaadt de pagina.
    let taps=0, tapTimer=null;
    document.getElementById('reset').addEventListener('pointerdown', () => {
      taps++; clearTimeout(tapTimer);
      tapTimer = setTimeout(function(){ taps=0; }, 800);
      if (taps>=3){ location.reload(); }
    });

    toIdle();
  </script>
</body>
</html>
